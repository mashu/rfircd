[package]
name = "rfircd"
version = "0.9.0"
edition = "2021"
rust-version = "1.75"
description = "IRC server with an RF gateway (KISS/Direwolf; AIRC and APRS) for amateur radio"
license = "MIT"
readme = "README.md"
homepage = "https://mashu.github.io/rfircd/"
repository = "https://github.com/mashu/rfircd"
default-run = "rfircd"
keywords = ["irc", "ax25", "ham-radio", "packet-radio", "amateur-radio"]
categories = ["network-programming", "command-line-utilities"]

# Three binaries, one library:
#   rfircd           — IRC server + RF gateway  (src/main.rs)
#   rfirc-station    — radio-side client        (src/bin/)
#   rfirc-kisshub    — virtual channel for tests (src/bin/)
# Cargo discovers those paths by convention.

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "io-std", "rt", "process"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
anyhow = "1"
serde_json = "1"
argon2 = { version = "0.5", features = ["std"] }
password-hash = "0.5"

# Serial KISS TNC support is optional so the core builds with no C deps.
tokio-serial = { version = "5", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
# Self-signed certificates for `--init`. Pure Rust, and it shares `ring` with
# rustls, so the marginal cost over what TLS already pulls in is small — which
# matters because the release artifacts are static musl builds with no OpenSSL.
# Not optional: the release workflow builds with no `--features`, so anything
# gated would be missing from exactly the binaries the installer ships.
rcgen = "0.13"
# SHA-256 for the certificate fingerprint `--init` prints, so a self-signed
# cert can be pinned in an IRC client. Already in the tree under rustls;
# naming it directly costs no extra compilation.
ring = "0.17"

[features]
default = []
serial = ["dep:tokio-serial"]

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
panic = "abort"

[dev-dependencies]
# rcgen moved to [dependencies] for `--init`; tests use it from there.
