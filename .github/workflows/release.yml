name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x86_64
            appimage: "yes"
          - target: aarch64-unknown-linux-musl
            arch: aarch64
            appimage: "no"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Zig
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          ZIG_VERSION=0.13.0
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz" -o zig.tar.xz
          tar -xJf zig.tar.xz
          echo "${{ runner.temp }}/zig-linux-x86_64-${ZIG_VERSION}" >> "$GITHUB_PATH"
      - run: zig version
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Build (static musl)
        # rustc 1.97+ surfaces linker stderr as `linker_messages`. zig cc always
        # warns about rustc's -O1, and Zig 0.13's musl CRT warns on a K&R
        # prototype in dlstart.c. Neither is from this crate.
        # https://github.com/rust-lang/rust/issues/158192
        env:
          RUSTFLAGS: "-A linker_messages"
        run: cargo zigbuild --release --target ${{ matrix.target }}
      - name: Dist
        run: |
          chmod +x packaging/linux/build-dist.sh packaging/linux/install.sh packaging/linux/AppRun
          extra=
          if [ "${{ matrix.appimage }}" != "yes" ]; then
            extra=--skip-appimage
          fi
          ./packaging/linux/build-dist.sh \
            --bin-dir "target/${{ matrix.target }}/release" \
            --arch "${{ matrix.arch }}" \
            $extra
      - name: Checksums
        run: |
          cd dist
          sha256sum rfircd-* > SHA256SUMS-${{ matrix.arch }}.txt
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*

  publish:
    needs: linux
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Combine checksums
        run: |
          cd dist
          cat SHA256SUMS-*.txt | sort > SHA256SUMS.txt
          rm -f SHA256SUMS-*.txt
          ls -lh
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*
          body: |
            Prebuilt GNU/Linux binaries (statically linked musl).

            | File | What |
            |---|---|
            | `rfircd-x86_64.AppImage` | all three tools in one file; `chmod +x` and run |
            | `rfircd-x86_64.run` | self-extracting installer (`~/.local` or `sudo … --system`) |
            | `rfircd-x86_64-linux.tar.gz` | binaries + `install.sh` |
            | `rfircd-aarch64-linux.tar.gz` / `.run` | 64-bit ARM (Pi, etc.) |

            QMX on Debian: https://mashu.github.io/rfircd/stable/qmx/
