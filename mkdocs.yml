site_name: rfircd
site_url: https://mashu.github.io/rfircd/
site_description: IRC server with an RF gateway (KISS/Direwolf; AIRC and APRS)
repo_url: https://github.com/mashu/rfircd
repo_name: mashu/rfircd
edit_uri: edit/main/docs/
copyright: MIT. You are the licensee.

theme:
  name: material
  language: en
  logo: assets/rfircd.svg
  favicon: assets/rfircd.svg
  font: false
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - content.code.copy
    - content.tabs.link
    - toc.follow
    - search.suggest

extra:
  version:
    provider: mike
    alias: true
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mashu/rfircd

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - mike:
      alias_type: copy
      canonical_version: null

nav:
  - Home: index.md
  - Quick start:
      - Start here: quickstart.md
      - Install: install.md
      - QMX on Debian: qmx.md
  - Using:
      - IRC and privileges: usage.md
      - Airtime and duty cycle: airtime.md
      - Station and kisshub: station.md
  - Reference:
      - Design: design.md
      - Protocol: protocol.md
      - Regulatory: regulatory.md
      - Packaging: packaging.md
  - Contributing: contributing.md
