<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 160" role="img" aria-label="QMX to Direwolf to rfircd to IRC">
  <rect width="920" height="160" fill="#efe4c6"/>
  <g font-family="ui-monospace, monospace" font-size="13" fill="#1c1710">
    <rect x="8" y="28" width="150" height="88" rx="6" fill="#efe4c6" stroke="#1c1710" stroke-width="2"/>
    <text x="83" y="68" text-anchor="middle" font-size="16" font-weight="700">QMX</text>
    <text x="83" y="90" text-anchor="middle" font-size="11">SSB USB, IQ off</text>

    <path d="M158 72 h48" stroke="#a33c2a" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="182" y="62" text-anchor="middle" font-size="10" fill="#a33c2a">USB</text>

    <rect x="214" y="28" width="190" height="88" rx="6" fill="#efe4c6" stroke="#1c1710" stroke-width="2"/>
    <text x="309" y="68" text-anchor="middle" font-size="16" font-weight="700">Direwolf</text>
    <text x="309" y="90" text-anchor="middle" font-size="11">300 baud, KISS :8001</text>

    <path d="M404 72 h48" stroke="#a33c2a" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="428" y="62" text-anchor="middle" font-size="10" fill="#a33c2a">KISS</text>

    <rect x="460" y="28" width="190" height="88" rx="6" fill="#1a2418" stroke="#c4a35a" stroke-width="2"/>
    <text x="555" y="68" text-anchor="middle" font-size="16" font-weight="700" fill="#7cff6b">rfircd</text>
    <text x="555" y="90" text-anchor="middle" font-size="11" fill="#efe4c6">IRC :6667</text>

    <path d="M650 72 h48" stroke="#c4a35a" stroke-width="2" marker-end="url(#arrow2)"/>
    <text x="674" y="62" text-anchor="middle" font-size="10" fill="#c4a35a">TCP</text>

    <rect x="706" y="28" width="196" height="88" rx="6" fill="#efe4c6" stroke="#1c1710" stroke-width="2"/>
    <text x="804" y="68" text-anchor="middle" font-size="16" font-weight="700">irssi</text>
    <text x="804" y="90" text-anchor="middle" font-size="11">127.0.0.1:6667</text>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a33c2a"/>
    </marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c4a35a"/>
    </marker>
  </defs>
</svg>
