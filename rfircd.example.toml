# rfircd example configuration.
#
# Copy to rfircd.toml and edit. Check it with:  rfircd --check -c rfircd.toml
#
# READ docs/regulatory.md BEFORE ENABLING THE RADIO SECTION. Running this
# server with radio.enabled = true makes your station transmit automatically,
# under your licence, carrying other people's traffic.

[server]
name = "rfirc.sk0mt.example"
network = "RFIRC"
motd = [
  "SK0MT packet gateway, 144.800 MHz, 1200 baud AFSK",
  "Channels marked +r are transmitted on the air in the clear.",
  "Identify with: /quote CALLSIGN SM0ABC",
  "Keep nick and callsign: /quote REGISTER <password>  then  IDENTIFY <password>",
  "Air: a control operator must RADIO GRANT your registered nick. CALLSIGN is also required.",
]
max_nick_len = 30
max_channels_per_user = 20
# password = "optional connection password"

[listen]
# Plaintext. Connections from this machine (loopback) have full access — that
# is the radio operator's console. Connections from anywhere else are
# listen-only: they may join and watch, they may not speak, IDENTIFY, OPER,
# or key the transmitter. Put internet users on [listen.tls].
bind = ["127.0.0.1:6667"]
ping_interval_secs = 120
registration_timeout_secs = 60
# Simultaneous connections from one address, and in total. Both matter: the
# per-host cap alone bounds nothing, because an attacker with a hundred source
# addresses is under it on every one of them. 0 disables either cap.
max_conns_per_host = 8
max_clients = 256

# Implicit TLS (port 6697 in most clients). Required for anyone off this
# machine who will speak, register, OPER, or control the radio. TLS protects
# the IP hop only: everything that reaches the air is, and must be, in the
# clear.
# [listen.tls]
# bind = ["0.0.0.0:6697"]
# cert = "/etc/rfircd/fullchain.pem"
# key = "/etc/rfircd/privkey.pem"

[logging]
# Extra copy of tracing output. stderr/journald still get the same lines.
# file = "rfircd.log"
# Who connected, claimed a callsign, flooded, kicked, and what went on the air.
# audit_file = "audit.log"

[accounts]
# Argon2id hashes of nick passwords, bound callsigns, RF-TX grants, and IP bans
# (KLINE). Created on first REGISTER.
file = "nicks.json"
identify_timeout_secs = 60
min_password_len = 8

[radio]
enabled = false

# The station that transmits. This callsign is what appears in every AX.25
# source address and in the periodic identification.
callsign = "SK0MT-1"

# AX.25 destination address used for broadcast (channel) traffic. Acts as a
# protocol marker so others on frequency can filter AIRC out.
destination = "AIRC"

# Digipeater path. Empty is best. Two hops is the maximum this server allows.
path = []

# Identification interval in seconds. Must be <= 600.
id_interval_secs = 540
id_text = "RFIRC gateway - IRC over RF"

# AX.25 information field limit. 128 gets through a noisy channel far more
# often than the 256 byte default.
paclen = 128

ack_timeout_secs = 12
max_retries = 3
peer_idle_timeout_secs = 1800

# Send join/part notices over the air. Off by default: JOIN/PART/QUIT already
# stay on IRC, and turning this on is most of your airtime for very little
# information. Leave it false unless RF stations have no other way to see who
# is in the channel.
presence_notices = false

# Hold private messages for stations that are out of range and deliver them
# when the station is next heard. Bounded and expiring by design.
mailbox_enabled = true
mailbox_per_station = 10
mailbox_total = 200
mailbox_ttl_secs = 86400

# Repeat RF-originated messages back onto RF for stations that are hidden from
# each other. Doubles the airtime cost of every message.
repeat_rf_traffic = false

# NOTICE the sender when a channel message is actually put on the air.
notice_air_relay = true

# Airtime the transmit queue may hold before new traffic is refused.
# In seconds of key-down time, not frames: sixty short frames and six long
# ones are very different amounts of transmitting. When the queue is this
# deep, senders are told so immediately rather than having their message
# accepted and quietly dropped at the transmitter two minutes later.
max_queued_airtime_secs = 60

# Held messages delivered per exchange with a station. Keep this at 1: a
# full mailbox released on one HELLO is a minute of transmitting caused by
# one short frame from a handheld that may be in range for thirty seconds.
# The rest go out as the station keeps talking.
mailbox_flush_batch = 1

# Most names sent in reply to an explicit NAMES from a station. Member lists
# are never sent unasked — joining a channel does not read out the roll.
rf_names_max = 8

# Answer APRS messages addressed to this gateway. A stock APRS radio
# (Kenwood, Yaesu, APRSdroid, …) can then put a line into a bridged channel:
# message the gateway callsign with `#rf hello`. The gateway ACKs so the
# radio stops retrying; not answering is more airtime than the ACK.
# Position reports and status beacons heard on frequency are shown on IRC
# as NOTICE and are never retransmitted.
aprs = true
# Channel used when the message text has no `#channel` prefix, and for
# positions/beacons. Empty: messages need the prefix; beacons go to the
# first +r channel. Must be a configured +r channel if set.
# aprs_channel = "#rf"
# How outbound RF chat is encoded. Inbound always accepts both APRS and AIRC.
# "airc" (default): one AIRC broadcast per line; APRS-only HTs still get an
# addressed APRS copy. "aprs": APRS messages only (one per RF peer in the
# channel); no AIRC CQ.
# rf_mode = "airc"

# External transmit interlock: a command that decides whether it is safe to
# key up at all. rfircd cannot see the radio — it speaks KISS to a modem,
# and KISS carries frames, not SWR readings — so this check is yours to
# supply. Point it at an SWR meter, a temperature probe on the finals, a GPIO
# from a hardware interlock, or a file somebody touches before climbing the
# tower.
#
# While it fails, NOTHING is transmitted, station identification included.
# It fails closed: a command that cannot be run, times out, or has not run
# yet counts as a failure. Required for unattended QMX operation.
#
# [radio.interlock]
# command = "/usr/local/bin/check-swr"
# args = ["--max", "2.5"]
# interval_secs = 30
# timeout_secs = 5

[radio.tnc]
# "tcp" (Direwolf, ax25-tools KISS-over-TCP), "serial" (needs --features
# serial), or "loopback" for a dry run that transmits nothing.
kind = "tcp"
host = "127.0.0.1"
port = 8001
# device = "/dev/ttyUSB0"
# baud = 9600
kiss_port = 0
# Optional: `--check` compares MODEM / TXDELAY / TXTAIL to [radio.duty].
# direwolf_conf = "/etc/direwolf-qmx.conf"

# Minimum gap between transmissions. At 1200 baud a 128 byte frame is about
# one second of airtime, so leave room for everyone else.
tx_pacing_ms = 1500

# Channel-access parameters pushed to the TNC at connect. TXDELAY and TXTAIL
# are NOT here: they are key-down time, the airtime governor has to know them
# to price a frame, and two places to write the same physical quantity is two
# places to get it wrong. They live in [radio.duty] below and are pushed from
# there, so the model and the hardware cannot disagree. Full duplex is always
# forced off — a TNC that transmits without listening first is the one thing
# none of this can protect you from.
# persistence = 63
# slottime = 10

# ---------------------------------------------------------------------------
# Transmitter airtime governor.
#
# This is not a fairness knob — [policy] below is. This one protects the
# hardware and the band. Every frame is costed in seconds of key-down time
# (txdelay + data + txtail) before it is transmitted, and three independent
# limits apply: a duty cycle over a sliding window, a maximum unbroken run
# followed by a forced cooldown, and a hard airtime ceiling per rolling hour.
#
# It matters most on QRP HF. A QMX-class radio has finals with no thermal
# headroom, and at 300 baud a single 128-octet frame is roughly four seconds
# of continuous carrier — a handful of queued messages is already a minute
# of transmitting. The defaults below assume exactly that setup.
#
# For 1200 baud VHF FM with a radio that has a heatsink, `baud = 1200` and
# something like max_duty_percent = 40 is reasonable.
#
# `RADIO DUTY` shows the live figures. Frames the governor has held longer
# than max_hold_secs are dropped: a two-minute-old chat line is not worth
# the airtime it would cost.
# max_duty_percent is capped at 50 whatever you write here, and a
# max_continuous/cooldown pair that would exceed 50% in bursts is refused at
# startup. Both are checked by `--check`.
[radio.duty]
enabled = true
baud = 300
# Real key-down time either side of the data, and the single source of truth
# for it: these are pushed to the TNC as the KISS TXDELAY and TXTAIL
# parameters at connect, so what the governor prices and what the modem does
# are the same numbers. KISS carries them in 10 ms units, so 2550 ms is the
# ceiling.
txdelay_ms = 400
txtail_ms = 300
window_secs = 600
max_duty_percent = 25
max_continuous_secs = 30
cooldown_secs = 60
# 0 disables the hourly ceiling.
hourly_airtime_secs = 900
max_hold_secs = 120

[policy]
# Upper bound on a radiated message. The effective limit is whichever is
# smaller: this, or whatever fits in max_rf_fragments frames at the
# configured paclen — the server logs the figure it settled on at startup.
max_rf_text_len = 160
# Most AX.25 frames one radiated message may become. This is the real length
# limit: fragmentation multiplies the airtime and the loss rate, and a
# message only arrives if every fragment does. Two frames is a sentence.
max_rf_fragments = 2
rf_msgs_per_min = 6
rf_burst = 4
ip_to_rf_msgs_per_min = 10
ip_to_rf_burst = 4
rf_channel_msgs_per_min = 10
rf_channel_burst = 4
ip_cmds_per_min = 90
ip_cmd_burst = 30
block_apparent_ciphertext = true
identify_per_min = 6
identify_burst = 3
# An IP user's messages are radiated only after:
#   1. REGISTER + IDENTIFY (the nick is stored in accounts.file)
#   2. RADIO GRANT <nick> by a control operator (persisted on that account)
#   3. CALLSIGN <call> (legal third-party identification; restored on IDENTIFY)
# OPER always has RF-TX. RF stations on the air are not IRC accounts.
deny_callsigns = []
allow_callsigns = []   # empty means any amateur callsign may use the RF side

[[channels]]
name = "#rf"
topic = "Bridged to 144.800 MHz - everything here is transmitted"
rf = true
operators = ["sm0abc"]

[[channels]]
name = "#local"
topic = "Internet only, nothing here goes on the air"
rf = false

[[opers]]
name = "sm0abc"
# Plaintext is accepted only when listen.bind is loopback. On a public
# address, paste an Argon2id hash from: rfircd --hash-password
password = "change-me"
